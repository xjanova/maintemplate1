# ╔═══════════════════════════════════════════════════════════════════════════╗
# ║                    XCLAUDE FRAMEWORK - Auto Deploy                        ║
# ║                                                                           ║
# ║  Workflow สำหรับ Deploy อัตโนมัติเมื่อ merge เข้า main                       ║
# ║  พร้อมระบบ feedback สำหรับ Claude และแจ้งเตือน Line OA                       ║
# ╚═══════════════════════════════════════════════════════════════════════════╝

name: Auto Deploy

on:
  push:
    branches:
      - main
  workflow_dispatch:
    inputs:
      force_deploy:
        description: 'Force deploy'
        required: false
        default: 'false'

permissions:
  contents: write
  issues: write

env:
  DEPLOY_LOG_FILE: "deploy-output.log"

jobs:
  deploy:
    name: Deploy to Server
    runs-on: ubuntu-latest
    outputs:
      status: ${{ steps.deploy.outputs.status }}
      url: ${{ steps.deploy.outputs.url }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup SSH
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.SSH_PRIVATE_KEY }}" > ~/.ssh/id_rsa
          chmod 600 ~/.ssh/id_rsa
          # Generate known_hosts if not provided
          if [ -n "${{ secrets.SSH_KNOWN_HOSTS }}" ]; then
            echo "${{ secrets.SSH_KNOWN_HOSTS }}" > ~/.ssh/known_hosts
          else
            ssh-keyscan -H ${{ secrets.SERVER_HOST }} > ~/.ssh/known_hosts 2>/dev/null
          fi
          chmod 644 ~/.ssh/known_hosts

      - name: Deploy to Server
        id: deploy
        run: |
          echo "🚀 Starting deployment..."
          echo "Server: ${{ secrets.SERVER_HOST }}"
          echo "Path: ${{ secrets.DEPLOY_PATH }}"

          set +e
          DEPLOY_OUTPUT=$(ssh -o StrictHostKeyChecking=no \
            ${{ secrets.SERVER_USER }}@${{ secrets.SERVER_HOST }} "
            cd ${{ secrets.DEPLOY_PATH }} && \
            git fetch origin main && \
            git reset --hard origin/main && \
            chmod +x deploy.sh && \
            ./deploy.sh 2>&1
          " 2>&1)
          EXIT_CODE=$?
          set -e

          echo "$DEPLOY_OUTPUT" > $DEPLOY_LOG_FILE
          echo "$DEPLOY_OUTPUT"

          if [ $EXIT_CODE -eq 0 ]; then
            echo "status=success" >> $GITHUB_OUTPUT
            echo "url=${{ secrets.SITE_URL }}" >> $GITHUB_OUTPUT
          else
            echo "status=failed" >> $GITHUB_OUTPUT
            echo "url=" >> $GITHUB_OUTPUT
          fi

      - name: Upload Deploy Log
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: deploy-log-${{ github.run_number }}
          path: ${{ env.DEPLOY_LOG_FILE }}
          retention-days: 30

      - name: Health Check
        id: health
        if: steps.deploy.outputs.status == 'success'
        run: |
          echo "⏳ Waiting for service to start..."
          sleep 5

          SITE_URL="${{ secrets.SITE_URL }}"
          HTTP_STATUS=$(curl -s -o /dev/null -w "%{http_code}" "$SITE_URL" --max-time 30 || echo "000")

          if [ "$HTTP_STATUS" -ge 200 ] && [ "$HTTP_STATUS" -lt 400 ]; then
            echo "✅ Health check passed! HTTP $HTTP_STATUS"
            echo "healthy=true" >> $GITHUB_OUTPUT
          else
            echo "⚠️ Health check returned HTTP $HTTP_STATUS"
            echo "healthy=false" >> $GITHUB_OUTPUT
          fi

      - name: Line Notify on Success
        if: steps.deploy.outputs.status == 'success' && secrets.LINE_NOTIFY_TOKEN != ''
        run: |
          curl -s -X POST \
            -H "Authorization: Bearer ${{ secrets.LINE_NOTIFY_TOKEN }}" \
            -F "message=✅ Deploy สำเร็จ!
🌐 URL: ${{ secrets.SITE_URL }}
📦 Commit: ${{ github.sha }}
⏰ Time: $(date '+%Y-%m-%d %H:%M:%S')" \
            https://notify-api.line.me/api/notify || true

      - name: Line Notify on Failure
        if: steps.deploy.outputs.status == 'failed' && secrets.LINE_NOTIFY_TOKEN != ''
        run: |
          curl -s -X POST \
            -H "Authorization: Bearer ${{ secrets.LINE_NOTIFY_TOKEN }}" \
            -F "message=❌ Deploy ล้มเหลว!
📍 Repo: ${{ github.repository }}
🔗 Workflow: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
Claude กำลังพยายามแก้ไข..." \
            https://notify-api.line.me/api/notify || true

      - name: Create Issue on Failure
        if: steps.deploy.outputs.status == 'failed'
        uses: actions/github-script@v7
        with:
          script: |
            await github.rest.issues.create({
              owner: context.repo.owner,
              repo: context.repo.repo,
              title: '🚨 Deploy Failed - ' + new Date().toISOString().split('T')[0],
              body: `## Deploy ล้มเหลว

**Commit:** ${{ github.sha }}
**Workflow:** ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}

### สำหรับ Claude
กรุณาตรวจสอบและแก้ไข:
1. ดู deploy logs ใน artifacts
2. ตรวจสอบ \`.deploy-feedback.json\` บน server
3. แก้ไขโค้ดและ push ใหม่

### Quick Links
- [View Logs](${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }})
`,
              labels: ['deploy-failed', 'xclaude-action-needed']
            });

      - name: Summary
        run: |
          echo "## 🚀 Deploy Summary" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY

          if [ "${{ steps.deploy.outputs.status }}" == "success" ]; then
            echo "✅ **Status:** Deployed Successfully" >> $GITHUB_STEP_SUMMARY
            echo "🌐 **URL:** ${{ steps.deploy.outputs.url }}" >> $GITHUB_STEP_SUMMARY
            echo "📦 **Commit:** ${{ github.sha }}" >> $GITHUB_STEP_SUMMARY
          else
            echo "❌ **Status:** Deploy Failed" >> $GITHUB_STEP_SUMMARY
            echo "📋 **Logs:** Check artifacts for details" >> $GITHUB_STEP_SUMMARY
          fi
