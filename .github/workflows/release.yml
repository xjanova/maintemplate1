# Auto Release Workflow
# Automatically creates releases with semantic versioning when merging to main
# Generates changelog from commit messages

name: Auto Release

on:
  push:
    branches:
      - main
    paths-ignore:
      - '**.md'
      - 'docs/**'

permissions:
  contents: write
  pull-requests: read

jobs:
  release:
    name: Create Release
    runs-on: ubuntu-latest
    outputs:
      new_version: ${{ steps.version.outputs.new_version }}
      changelog: ${{ steps.changelog.outputs.changelog }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Get latest tag
        id: latest_tag
        run: |
          # Get the latest tag, default to v0.0.0 if none exists
          LATEST_TAG=$(git describe --tags --abbrev=0 2>/dev/null || echo "v0.0.0")
          echo "tag=$LATEST_TAG" >> $GITHUB_OUTPUT
          echo "Latest tag: $LATEST_TAG"

      - name: Determine version bump
        id: version
        run: |
          LATEST_TAG="${{ steps.latest_tag.outputs.tag }}"

          # Remove 'v' prefix for version calculation
          VERSION="${LATEST_TAG#v}"
          IFS='.' read -r MAJOR MINOR PATCH <<< "$VERSION"

          # Get commit messages since last tag
          if [ "$LATEST_TAG" = "v0.0.0" ]; then
            COMMITS=$(git log --pretty=format:"%s" HEAD)
          else
            COMMITS=$(git log --pretty=format:"%s" ${LATEST_TAG}..HEAD)
          fi

          # Determine version bump based on conventional commits
          if echo "$COMMITS" | grep -qiE "^(BREAKING CHANGE|feat!|fix!):"; then
            # Major version bump
            MAJOR=$((MAJOR + 1))
            MINOR=0
            PATCH=0
            BUMP_TYPE="major"
          elif echo "$COMMITS" | grep -qiE "^feat(\(.+\))?:"; then
            # Minor version bump
            MINOR=$((MINOR + 1))
            PATCH=0
            BUMP_TYPE="minor"
          else
            # Patch version bump
            PATCH=$((PATCH + 1))
            BUMP_TYPE="patch"
          fi

          NEW_VERSION="v${MAJOR}.${MINOR}.${PATCH}"
          echo "new_version=$NEW_VERSION" >> $GITHUB_OUTPUT
          echo "bump_type=$BUMP_TYPE" >> $GITHUB_OUTPUT
          echo "New version: $NEW_VERSION ($BUMP_TYPE bump)"

      - name: Generate changelog
        id: changelog
        run: |
          LATEST_TAG="${{ steps.latest_tag.outputs.tag }}"

          # Generate changelog from commits
          echo "## What's Changed" > /tmp/changelog.md
          echo "" >> /tmp/changelog.md

          if [ "$LATEST_TAG" = "v0.0.0" ]; then
            COMMITS=$(git log --pretty=format:"* %s (%h)" HEAD)
          else
            COMMITS=$(git log --pretty=format:"* %s (%h)" ${LATEST_TAG}..HEAD)
          fi

          # Categorize commits
          echo "### Features" >> /tmp/changelog.md
          echo "$COMMITS" | grep -iE "^\* feat" >> /tmp/changelog.md || echo "_No new features_" >> /tmp/changelog.md
          echo "" >> /tmp/changelog.md

          echo "### Bug Fixes" >> /tmp/changelog.md
          echo "$COMMITS" | grep -iE "^\* fix" >> /tmp/changelog.md || echo "_No bug fixes_" >> /tmp/changelog.md
          echo "" >> /tmp/changelog.md

          echo "### Other Changes" >> /tmp/changelog.md
          echo "$COMMITS" | grep -viE "^\* (feat|fix)" >> /tmp/changelog.md || echo "_No other changes_" >> /tmp/changelog.md
          echo "" >> /tmp/changelog.md

          echo "---" >> /tmp/changelog.md
          echo "**Full Changelog**: https://github.com/${{ github.repository }}/compare/${LATEST_TAG}...${{ steps.version.outputs.new_version }}" >> /tmp/changelog.md

          # Output for use in release
          CHANGELOG=$(cat /tmp/changelog.md)
          echo "changelog<<EOF" >> $GITHUB_OUTPUT
          echo "$CHANGELOG" >> $GITHUB_OUTPUT
          echo "EOF" >> $GITHUB_OUTPUT

      - name: Create Release
        uses: softprops/action-gh-release@v1
        with:
          tag_name: ${{ steps.version.outputs.new_version }}
          name: Release ${{ steps.version.outputs.new_version }}
          body: ${{ steps.changelog.outputs.changelog }}
          draft: false
          prerelease: false
          generate_release_notes: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Update CHANGELOG.md
        run: |
          NEW_VERSION="${{ steps.version.outputs.new_version }}"
          DATE=$(date +%Y-%m-%d)

          # Create new changelog entry
          {
            echo "# Changelog"
            echo ""
            echo "## [$NEW_VERSION] - $DATE"
            echo ""
            cat /tmp/changelog.md | tail -n +2
            echo ""
            if [ -f CHANGELOG.md ]; then
              tail -n +3 CHANGELOG.md
            fi
          } > /tmp/new_changelog.md

          mv /tmp/new_changelog.md CHANGELOG.md

          # Commit changelog update
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add CHANGELOG.md
          git commit -m "docs: update CHANGELOG.md for $NEW_VERSION [skip ci]" || echo "No changes to commit"
          git push
