# ╔═══════════════════════════════════════════════════════════════════════════╗
# ║                    XCLAUDE FRAMEWORK - Security Scan                      ║
# ╚═══════════════════════════════════════════════════════════════════════════╝

name: Security Scan

on:
  push:
    branches: [main, develop, claude/main]
  pull_request:
    branches: [main, claude/main]
  schedule:
    - cron: '0 0 * * 0'  # Weekly on Sunday
  workflow_dispatch:

permissions:
  contents: read
  security-events: write

jobs:
  security-scan:
    name: Security Analysis
    runs-on: ubuntu-latest
    # Skip if triggered by bot commits (prevents loops)
    if: ${{ !contains(github.event.head_commit.message, '[skip ci]') }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: PHP Security Checker
        run: |
          if [ -f "composer.lock" ]; then
            curl -sL https://github.com/fabpot/local-php-security-checker/releases/latest/download/local-php-security-checker_linux_amd64 -o security-checker
            chmod +x security-checker
            ./security-checker || echo "::warning::Vulnerabilities found in PHP dependencies"
          else
            echo "No composer.lock found, skipping PHP security check"
          fi

      - name: Node Security Audit
        run: |
          if [ -f "package-lock.json" ]; then
            npm audit --audit-level=high || echo "::warning::Vulnerabilities found in npm dependencies"
          else
            echo "No package-lock.json found, skipping npm audit"
          fi

      - name: Scan for Secrets
        uses: trufflesecurity/trufflehog@main
        with:
          extra_args: --only-verified
        continue-on-error: true

      - name: Summary
        run: |
          echo "## Security Scan Complete" >> $GITHUB_STEP_SUMMARY
          echo "- PHP dependency check: ✓" >> $GITHUB_STEP_SUMMARY
          echo "- npm audit: ✓" >> $GITHUB_STEP_SUMMARY
          echo "- Secrets scan: ✓" >> $GITHUB_STEP_SUMMARY
