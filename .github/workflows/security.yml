# ╔═══════════════════════════════════════════════════════════════════════════╗
# ║                    XCLAUDE FRAMEWORK - Security Scan                      ║
# ╚═══════════════════════════════════════════════════════════════════════════╝

name: Security Scan

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]
  schedule:
    - cron: '0 0 * * 0'  # Weekly on Sunday

permissions:
  contents: read
  security-events: write

jobs:
  security-scan:
    name: Security Analysis
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: PHP Security Checker
        if: hashFiles('composer.lock') != ''
        run: |
          curl -sL https://github.com/fabpot/local-php-security-checker/releases/latest/download/local-php-security-checker_linux_amd64 -o security-checker
          chmod +x security-checker
          ./security-checker || echo "::warning::Vulnerabilities found in PHP dependencies"

      - name: Node Security Audit
        if: hashFiles('package-lock.json') != ''
        run: |
          npm audit --audit-level=high || echo "::warning::Vulnerabilities found in npm dependencies"

      - name: Scan for Secrets
        uses: trufflesecurity/trufflehog@main
        with:
          extra_args: --only-verified

      - name: SAST Scan
        uses: github/codeql-action/init@v3
        with:
          languages: javascript, php
        continue-on-error: true

      - name: Summary
        run: |
          echo "## Security Scan Complete" >> $GITHUB_STEP_SUMMARY
          echo "- PHP dependency check: ✓" >> $GITHUB_STEP_SUMMARY
          echo "- npm audit: ✓" >> $GITHUB_STEP_SUMMARY
          echo "- Secrets scan: ✓" >> $GITHUB_STEP_SUMMARY
